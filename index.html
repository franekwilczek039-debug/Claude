<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blackjack Royale</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Ekran startowy -->
<section id="setup" class="setup">
  <div class="setup-card">
    <h1><span class="logo-suit red">♥</span> Blackjack Royale <span class="logo-suit">♠</span></h1>
    <p class="subtitle">Kasyno dla 1–5 graczy przy jednym stole</p>

    <div class="form-grid">
      <label>Liczba graczy
        <select id="numPlayers">
          <option>1</option><option selected>2</option><option>3</option><option>4</option><option>5</option>
        </select>
      </label>
      <label>Żetony na start
        <select id="startChips">
          <option value="500">500</option><option value="1000" selected>1 000</option>
          <option value="2500">2 500</option><option value="5000">5 000</option><option value="10000">10 000</option>
        </select>
      </label>
      <label>Talie w bucie
        <select id="decks">
          <option>1</option><option>2</option><option>4</option><option selected>6</option><option>8</option>
        </select>
      </label>
      <label>Tempo rozdawania
        <select id="speed">
          <option value="160">Szybkie</option><option value="380" selected>Normalne</option><option value="650">Wolne</option>
        </select>
      </label>
    </div>

    <div class="checks">
      <label><input type="checkbox" id="h17"> Krupier dobiera na miękkie 17 (H17)</label>
      <label><input type="checkbox" id="surrender" checked> Poddanie (late surrender)</label>
    </div>

    <h2>Gracze</h2>
    <div id="nameInputs" class="names"></div>
    <button class="btn ghost small" id="randomNames" type="button">🎲 Losowe imiona</button>

    <div class="setup-actions">
      <button class="btn primary big" id="startBtn" type="button">Usiądź do stołu</button>
      <button class="btn big" id="continueBtn" type="button" hidden>Kontynuuj zapisaną grę</button>
    </div>
  </div>
</section>

<!-- Ekran gry -->
<section id="game" class="game" hidden>
  <header class="topbar">
    <div class="tb-left">
      <strong class="brand">♠ Blackjack Royale</strong>
      <span id="roundNo" class="pill">Runda 0</span>
      <span class="pill shoe-pill" title="Karty pozostałe w bucie">
        🂠 <span id="shoeCount">0</span>
        <span class="shoe-bar"><span id="shoeFill"></span></span>
      </span>
      <span id="countBox" class="pill count" hidden></span>
    </div>
    <div class="tb-right">
      <button class="icon-btn" data-act="toggleCount" title="Licznik kart Hi-Lo">🔢</button>
      <button class="icon-btn" data-act="toggleSound" id="soundBtn" title="Dźwięk">🔊</button>
      <button class="icon-btn" data-act="stats" title="Ranking i statystyki">🏆</button>
      <button class="icon-btn" data-act="rules" title="Zasady i skróty">📜</button>
      <button class="icon-btn" data-act="newGame" title="Nowa gra">⟲</button>
    </div>
  </header>

  <main class="table">
    <div class="shoe-box" aria-hidden="true"><div class="shoe-cards"></div><span>BUT</span></div>
    <section class="dealer">
      <div class="dealer-label">Krupier <span id="dealerVal" class="val"></span></div>
      <div id="dealerCards" class="cards"></div>
    </section>
    <div class="felt-text">
      <div class="arc">BLACKJACK PŁACI 3 : 2</div>
      <div id="dealerRule" class="arc small"></div>
      <div class="arc small">UBEZPIECZENIE PŁACI 2 : 1</div>
    </div>
    <section id="seats" class="seats"></section>
  </main>

  <footer id="controls" class="controls"></footer>

  <details class="history">
    <summary>📋 Historia rozdań</summary>
    <ol id="historyList" reversed></ol>
  </details>
</section>

<div id="modal" class="modal" hidden>
  <div class="modal-box">
    <button class="icon-btn close" data-act="closeModal">✕</button>
    <div id="modalBody"></div>
  </div>
</div>

<div id="toasts" class="toasts"></div>

<script src="game.js"></script>
</body>
</html>
